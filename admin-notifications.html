<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Notifications Admin — GSM</title>
  <style>
    body{font-family:system-ui,Arial,sans-serif;margin:0;padding:12px;background:#f7fafc;color:#0f172a}
    .panel{max-width:460px;margin:0 auto}
    h1{font-size:1.1rem;margin-bottom:8px}
    .controls{display:flex;gap:8px;margin-bottom:8px}
    button{padding:8px 10px;border-radius:8px;border:1px solid #cbd5e1;background:white;cursor:pointer}
    .list{margin-top:8px}
    .item{background:#fff;padding:12px;border-radius:10px;border:1px solid #e6edf3;margin-bottom:10px}
    .meta{font-size:0.9rem;color:#64748b;margin-top:6px}
    a.pdf{color:#2563eb;font-weight:700;text-decoration:underline}
  </style>
</head>
<body>
  <div class="panel">
    <h1>Notifications — Admin</h1>
    <div class="controls">
      <button id="btnMarkAll">Marquer tout lu</button>
      <button id="btnClearRead">Suppr. lus</button>
      <button id="btnClearAll">Tout supprimer</button>
    </div>
    <div id="list" class="list"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const listEl = document.getElementById('list');
    function getNotifications(){return JSON.parse(localStorage.getItem('notifications')||'[]');}
    function saveNotifications(list){localStorage.setItem('notifications',JSON.stringify(list));}

    // merge arrays avoiding duplicates by bagage_numero + createdAt
    function mergeNotifications(existing, incoming){
      const seen = new Set(existing.map(n => (n.bagage_numero||'') + '|' + (n.createdAt||n.receivedAt||'')));
      const merged = [...incoming.filter(n => { const key = (n.bagage_numero||'') + '|' + (n.createdAt||n.receivedAt||''); if (seen.has(key)) return false; seen.add(key); return true; }), ...existing];
      return merged.slice(0, 500); // keep reasonable limit
    }

    function render(){
      const items = getNotifications();
      if(!items.length){ listEl.innerHTML = '<div style="color:#6b7280;text-align:center;padding:18px">Aucune notification.</div>'; return; }
      listEl.innerHTML = items.map((n,idx)=>`<div class="item">
        <div><strong>Bagage #${n.bagage_numero||''}</strong> — ${n.exp_nom||''} ${n.exp_prenom||''} → ${n.dest_nom||''} ${n.dest_prenom||''}</div>
        <div class="meta">${n.pays_dest||''} ${n.destination||''} • ${n.nb_bagages||''} bagage(s) • ${n.poids||''} kg • ${n.prix||''} €</div>
        <div style="margin-top:8px">
          <a class="pdf" href="${n.pdfLink||('/pdfs/reservation_'+(n.bagage_numero||'')+'.pdf')}" target="_blank">Télécharger PDF</a>
          <button data-idx="${idx}" style="margin-left:8px">Supprimer</button>
          <button data-idx-edit="${idx}" style="margin-left:8px">Marquer lu</button>
          <span style="float:right;color:${n.read? '#16a34a':'#d97706'}">${n.read? 'Lue':'Non lue'}</span>
        </div>
      </div>`).join('');
      // wire delete & mark buttons
      Array.from(listEl.querySelectorAll('button[data-idx]')).forEach(b=>b.addEventListener('click',()=>{ const i=Number(b.getAttribute('data-idx')); const s=getNotifications(); s.splice(i,1); saveNotifications(s); render(); }));
      Array.from(listEl.querySelectorAll('button[data-idx-edit]')).forEach(b=>b.addEventListener('click',()=>{ const i=Number(b.getAttribute('data-idx-edit')); const s=getNotifications(); if(s[i]) s[i].read = true; saveNotifications(s); render(); }));
    }

    document.getElementById('btnMarkAll').addEventListener('click',()=>{ const s=getNotifications().map(n=>({...n,read:true})); saveNotifications(s); render(); });
    document.getElementById('btnClearRead').addEventListener('click',()=>{ const s=getNotifications().filter(n=>!n.read); saveNotifications(s); render(); });
    document.getElementById('btnClearAll').addEventListener('click',()=>{ if(confirm('Supprimer toutes les notifications ?')){ localStorage.removeItem('notifications'); render(); } });

    // determine server origin (local dev support)
    const SERVER_ORIGIN = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') ? (window.location.protocol + '//' + window.location.hostname + ':3002') : window.location.origin;

    // initial load from server REST endpoint (/api/notifications)
    (async function init(){
      try {
        const res = await fetch(SERVER_ORIGIN + '/api/notifications');
        if (res && res.ok) {
          const list = await res.json().catch(()=>[]);
          if (Array.isArray(list) && list.length) {
            const merged = mergeNotifications(getNotifications(), list);
            saveNotifications(merged);
          }
        }
      } catch (e) { console.warn('fetch /api/notifications failed', e); }
      render();

      // socket realtime: receive booking_notification and pending_notifications
      try{
        const socket = io(SERVER_ORIGIN);
        socket.on('booking_notification', data => { try{ const s=getNotifications(); s.unshift({...data, read:false}); saveNotifications(s); render(); }catch(e){} });
        socket.on('pending_notifications', list => { try{ if(!Array.isArray(list)||!list.length) return; const merged = mergeNotifications(getNotifications(), list); saveNotifications(merged); render(); }catch(e){} });
      }catch(e){console.warn('socket failed',e);}    
    })();

</body>
</html>
