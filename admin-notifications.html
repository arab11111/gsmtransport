<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Notifications — GSM Transport</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f4f7fb;
      --card:#ffffff;
      --primary:#1e40af;
      --primary2:#2563eb;
      --success:#16a34a;
      --danger:#dc2626;
      --warning:#f59e0b;
      --text:#0f172a;
      --muted:#64748b;
      --border:#e2e8f0;
      --shadow:0 10px 30px rgba(15,23,42,.08);
      --radius:18px;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Poppins',sans-serif;
      background:linear-gradient(180deg,#eef4ff 0%, #f8fbff 100%);
      color:var(--text);
      min-height:100vh;
      padding:20px;
    }

    .container{
      max-width:1200px;
      margin:auto;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
      margin-bottom:25px;
      flex-wrap:wrap;
    }

    .title h1{
      font-size:32px;
      color:var(--primary);
      margin-bottom:6px;
    }

    .title p{
      color:var(--muted);
      font-size:14px;
    }

    .status{
      display:flex;
      align-items:center;
      gap:10px;
      background:var(--card);
      padding:12px 18px;
      border-radius:14px;
      box-shadow:var(--shadow);
      border:1px solid var(--border);
    }

    .dot{
      width:12px;
      height:12px;
      border-radius:50%;
      background:#ef4444;
    }

    .dot.online{
      background:#16a34a;
      box-shadow:0 0 10px #16a34a;
    }

    .controls{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:20px;
    }

    button{
      border:none;
      cursor:pointer;
      font-family:'Poppins',sans-serif;
      transition:.25s;
    }

    .btn{
      padding:12px 18px;
      border-radius:12px;
      font-weight:600;
      display:flex;
      align-items:center;
      gap:8px;
      box-shadow:var(--shadow);
    }

    .btn-primary{
      background:linear-gradient(135deg,var(--primary),var(--primary2));
      color:white;
    }

    .btn-primary:hover{
      transform:translateY(-2px);
    }

    .btn-danger{
      background:#fee2e2;
      color:var(--danger);
    }

    .btn-danger:hover{
      background:#fecaca;
    }

    .btn-light{
      background:white;
      border:1px solid var(--border);
      color:var(--text);
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:18px;
      margin-bottom:25px;
    }

    .stat-card{
      background:var(--card);
      border-radius:var(--radius);
      padding:22px;
      box-shadow:var(--shadow);
      border:1px solid var(--border);
    }

    .stat-card span{
      color:var(--muted);
      font-size:14px;
    }

    .stat-card h2{
      margin-top:10px;
      font-size:34px;
      color:var(--primary);
    }

    .notifications{
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    .note{
      background:var(--card);
      border-radius:20px;
      padding:22px;
      box-shadow:var(--shadow);
      border:1px solid var(--border);
      transition:.25s;
      position:relative;
      overflow:hidden;
    }

    .note:hover{
      transform:translateY(-3px);
    }

    .note.unread{
      border-left:6px solid var(--primary);
      background:linear-gradient(to right,#eff6ff,#ffffff);
    }

    .note-header{
      display:flex;
      justify-content:space-between;
      gap:15px;
      flex-wrap:wrap;
      margin-bottom:15px;
    }

    .badge{
      background:#dbeafe;
      color:var(--primary);
      padding:6px 12px;
      border-radius:999px;
      font-size:13px;
      font-weight:600;
    }

    .bagage{
      font-size:20px;
      font-weight:700;
      color:var(--primary);
    }

    .info-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:15px;
      margin-top:10px;
    }

    .info-box{
      background:#f8fafc;
      padding:14px;
      border-radius:12px;
      border:1px solid #edf2f7;
    }

    .info-box label{
      display:block;
      color:var(--muted);
      font-size:13px;
      margin-bottom:5px;
    }

    .info-box strong{
      font-size:15px;
    }

    .time{
      margin-top:15px;
      color:var(--muted);
      font-size:13px;
    }

    .actions{
      margin-top:18px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .small-btn{
      padding:10px 14px;
      border-radius:10px;
      font-size:13px;
      font-weight:600;
    }

    .read-btn{
      background:#05ff5c;
      color:#71bd8e;
    }

    .delete-btn{
      background:#6becab;
      color:#eb6969;
    }

    .empty{
      background:white;
      padding:50px;
      border-radius:20px;
      text-align:center;
      color:var(--muted);
      box-shadow:var(--shadow);
    }

    .toast{
      position:fixed;
      top:20px;
      right:20px;
      background:#111827;
      color:white;
      padding:15px 20px;
      border-radius:14px;
      box-shadow:var(--shadow);
      z-index:9999;
      opacity:0;
      transform:translateY(-20px);
      transition:.3s;
    }

    .toast.show{
      opacity:1;
      transform:translateY(0);
    }

    /* PDF preview styles */
    .pdf-box{
      display:flex;
      gap:12px;
      align-items:center;
      margin-top:14px;
      background:#567da3;
      padding:12px;
      border-radius:12px;
      border:1px solid #9ec5fc;
    }

    .pdf-thumb{
      width:56px;
      height:56px;
      border-radius:8px;
      background:linear-gradient(180deg,#fff 0%,#b3c4e6 100%);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:24px;
      color:var(--primary);
      border:1px solid #b296c5;
    }

    .pdf-meta{
      flex:1;
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:center;
    }

    .pdf-name{
      font-weight:600;
      color:var(--text);
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

  /* settings update highlight */
  .settings-highlight{animation:settingsFlash 1.6s ease both}
  @keyframes settingsFlash{
    0%{ transform:translateY(-6px); opacity:0 }
    20%{ transform:translateY(0); opacity:1 }
    80%{ transform:translateY(0); opacity:1 }
    100%{ transform:translateY(-2px); opacity:1 }
  }

    .pdf-frame{
      margin-top:12px;
      border-radius:10px;
      overflow:hidden;
      border:1px solid #e6eef9;
    }

    @media(max-width:768px){
      .title h1{
        font-size:24px;
      }

      .controls{
        flex-direction:column;
      }

      .btn{
        width:100%;
        justify-content:center;
      }
      /* Make PDF name and action buttons stack on small screens so the download
         button stays visible and tappable */
      .pdf-box{
        gap:10px;
        align-items:center;
      }

      .pdf-meta{
        flex-direction:column;
        align-items:flex-start;
        gap:8px;
      }

      .pdf-meta > div{
        width:100%;
        display:flex;
        gap:8px;
        flex-wrap:wrap;
        justify-content:flex-start;
      }

      .pdf-name{
        max-width:100%;
        white-space:normal;
        overflow:visible;
      }

      .small-btn{
        padding:8px 10px;
        font-size:14px;
      }
    }

/* Mobile admin panel styles */
#mobileAdminBtn{
  display:flex;
  position:fixed;
  right:16px;
  bottom:16px;
  width:64px;
  height:64px;
  border-radius:50%;
  align-items:center;
  justify-content:center;
  z-index:1102;
  box-shadow:0 10px 30px rgba(16,24,40,0.35);
  font-size:22px;
  border: 2px solid rgba(255,255,255,0.12);
  transition:transform .15s ease, box-shadow .15s ease;
}

#mobileAdminPanel{
  display:none;
}

@media(max-width:768px){
  #mobileAdminBtn{ display:flex; background:linear-gradient(90deg,#0ea5e9,#2563eb); color:#fff; border:none; box-shadow:0 12px 36px rgba(14,165,233,0.16); animation:adminPulse 2.6s infinite; }
  #mobileAdminPanel{
    display:block;
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    background:var(--bg);
    padding:12px;
    border-top-left-radius:12px;
    border-top-right-radius:12px;
    box-shadow:0 -6px 30px rgba(0,0,0,0.12);
    transform:translateY(110%);
    transition:transform .25s ease;
    z-index:1001;
  }
  #mobileAdminPanel.show{ transform:translateY(0); }
  #mobileAdminPanel input, #mobileAdminPanel textarea{ width:100%; padding:8px; border-radius:8px; border:1px solid var(--border); }
  .mobile-admin-actions .btn{ flex:1; }
}

@keyframes adminPulse{
  0%{ transform:scale(1); box-shadow:0 8px 28px rgba(14,165,233,0.12); }
  50%{ transform:scale(1.05); box-shadow:0 18px 48px rgba(14,165,233,0.18); }
  100%{ transform:scale(1); box-shadow:0 8px 28px rgba(14,165,233,0.12); }
}
  </style>
</head>
<body>

<div class="container">

  <div class="topbar">
    <div class="title">
      <h1>📦 Notifications Admin</h1>
      <p>Gestion des réservations et nouveaux bagages GSM Transport</p>
    </div>

    <div class="status">
      <div class="dot" id="statusDot"></div>
      <span id="statusText">Connexion...</span>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-primary" id="btnAuth">
      🔐 Authentification Admin
    </button>

    <button class="btn btn-light" id="markAll">
      ✅ Tout marquer lu
    </button>

    <button class="btn btn-danger" id="clearAll">
      🗑️ Tout supprimer
    </button>
  </div>

  <div class="stats">
    <div class="stat-card">
      <span>Total notifications</span>
      <h2 id="totalCount">0</h2>
    </div>

    <div class="stat-card">
      <span>Non lues</span>
      <h2 id="unreadCount">0</h2>
    </div>

    <div class="stat-card">
      <span>Connexion Socket</span>
      <h2 id="socketState">OFF</h2>
    </div>
  </div>

  <div id="admin-settings-display" style="max-width:800px;margin:12px auto 0 auto;">
    <div id="public-selected-date" style="font-size:1rem;font-weight:700;color:#f1c70b;text-align:center;padding:8px 6px;border-radius:8px;background:rgba(0,0,0,0.06);">Aucune date définie</div>
    <div id="display-note" class="note" style="display:none;margin-top:8px;background:linear-gradient(90deg,#fffbe6,#ffe6e6);color:#3d0202;padding:10px;border-radius:10px;max-width:800px;margin-left:auto;margin-right:auto"></div>
  </div>

  <div class="notifications" id="list">
    <div class="empty">
      <h3>Aucune notification</h3>
      <p>Les nouvelles réservations apparaîtront ici.</p>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<!-- Mobile admin panel and toggle button -->
<button id="mobileAdminBtn" title="Admin" aria-label="Ouvrir panneau admin">✏️</button>
<div id="mobileAdminPanel" aria-hidden="true" style="display:none">
  <label style="font-weight:600">Sélectionner la date</label>
  <input type="date" id="mobileAdminDate" />
  <label style="font-weight:600;margin-top:8px;display:block">Laisser une note</label>
  <textarea id="mobileAdminNote" rows="3" placeholder="Message aux utilisateurs..." style="resize:vertical"></textarea>
  <label style="font-weight:600;margin-top:8px;display:block">Visible pour les utilisateurs</label>
  <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
    <input type="checkbox" id="mobileAdminVisible" />
    <label for="mobileAdminVisible" style="font-weight:600">Publier la note</label>
  </div>
  <div class="mobile-admin-actions" style="margin-top:8px;display:flex;gap:8px">
    <button class="btn btn-light" id="mobileAdminClose">Fermer</button>
    <button class="btn btn-primary" id="mobileAdminSave">Enregistrer</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
  const SERVER_ORIGIN =
    (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
      ? (window.location.protocol + '//' + window.location.hostname + ':3002')
      : window.location.origin;

  // Connect socket to same origin as the page to avoid CORS during local testing
  const socket = io();

  const storageKey = 'admin_notifications';

  const listEl = document.getElementById('list');

  // Load current settings and listen for realtime updates (note + selectedDate)
  function loadSettingsRealtime(){
    try{
      (async ()=>{
        try{
          const res = await fetch('/api/settings');
          if(res.ok){
            const s = await res.json().catch(()=>null);
            if(s){
              const date = s.selectedDate || s.adminSelectedDate || null;
              const note = s.note || s.adminNote || '';
              const visible = (s.visible === undefined) ? true : !!s.visible;
              const dn = document.getElementById('display-note');
              const pd = document.getElementById('public-selected-date');
              if(dn){
                if(visible && note && note.trim()){ dn.style.display=''; dn.innerHTML = note.replace(/\n/g,'<br>'); }
                else { dn.style.display='none'; dn.innerHTML=''; }
              }
              if(pd){ pd.textContent = (visible && date) ? date : 'Aucune date définie'; }
            }
          }
        }catch(e){ console.warn('fetch /api/settings failed', e); }
      })();

      socket.on('settings_updated', payload => {
        try{
          const date = payload && (payload.selectedDate || payload.adminSelectedDate) ? (payload.selectedDate || payload.adminSelectedDate) : '';
          const note = payload && (payload.note || payload.adminNote) ? (payload.note || payload.adminNote) : '';
          const visible = (payload && payload.visible === undefined) ? true : !!payload.visible;
          const dn = document.getElementById('display-note');
          const pd = document.getElementById('public-selected-date');
          if(dn){
            if(visible && note && note.trim()){ dn.style.display=''; dn.innerHTML = note.replace(/\n/g,'<br>'); }
            else { dn.style.display='none'; dn.innerHTML=''; }
          }
          if(pd){ pd.textContent = (visible && date) ? date : 'Aucune date définie'; }
          try{
            if(dn){ dn.classList.remove('settings-highlight'); void dn.offsetWidth; dn.classList.add('settings-highlight'); }
            if(pd){ pd.classList.remove('settings-highlight'); void pd.offsetWidth; pd.classList.add('settings-highlight'); }
            setTimeout(()=>{ try{ if(dn) dn.classList.remove('settings-highlight'); if(pd) pd.classList.remove('settings-highlight'); }catch(e){} },1600);
          }catch(e){ console.warn('settings_updated handler error', e); }
        }catch(e){}
      });

    }catch(e){ console.warn('loadSettingsRealtime error', e); }
  }

  loadSettingsRealtime();

  function showToast(message){
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');

    setTimeout(()=>{
      toast.classList.remove('show');
    },3000);
  }

  function load(){
    return JSON.parse(localStorage.getItem(storageKey) || '[]');
  }

  function save(list){
    localStorage.setItem(storageKey, JSON.stringify(list));
  }

  function updateStats(){
    const list = load();

    document.getElementById('totalCount').textContent = list.length;

    const unread = list.filter(n => !n.read).length;

    document.getElementById('unreadCount').textContent = unread;
  }

  function render(){

    const notes = load();

    updateStats();

    if(!notes.length){
      listEl.innerHTML = `
        <div class="empty">
          <h3>Aucune notification</h3>
          <p>Les nouvelles réservations apparaîtront ici.</p>
        </div>
      `;
      return;
    }

    listEl.innerHTML = notes.map((n,idx)=>{

      return `
        <div class="note ${!n.read ? 'unread' : ''}">
          
          <div class="note-header">
            <div>
              <div class="bagage">
                📦 Bagage #${n.bagage_numero || '---'}
              </div>
            </div>

            <div class="badge">
              ${n.read ? 'Lu' : 'Nouveau'}
            </div>
          </div>

          <div class="info-grid">

            <div class="info-box">
              <label>Expéditeur</label>
              <strong>${n.exp_nom || ''} ${n.exp_prenom || ''}</strong>
            </div>

            <div class="info-box">
              <label>Destinataire</label>
              <strong>${n.dest_nom || ''}</strong>
            </div>

            <div class="info-box">
              <label>Téléphone</label>
              <strong>${n.exp_phone || 'Non renseigné'}</strong>
            </div>

            <div class="info-box">
              <label>Ville</label>
              <strong>${n.destination || 'Non renseignée'}</strong>
            </div>

          </div>

          <div class="time">
            🕒 ${new Date(n.createdAt || n.receivedAt || Date.now()).toLocaleString('fr-FR')}
          </div>

          ${(n.pdfLink || n.pdf_url || n.pdf) ? `
            <div class="pdf-box">
              <div class="pdf-thumb">📄</div>
              <div class="pdf-meta">
                <div class="pdf-name">${n.pdf_name || (n.pdfLink || n.pdf_url || n.pdf).split('/').pop()}</div>
                <div style="display:flex;gap:8px">
                  <button class="small-btn btn-light" onclick="openPdf(${idx})">Voir</button>
                  <button class="small-btn btn-light" onclick="downloadPdf(${idx})">Télécharger</button>
                  <button class="small-btn btn-light" onclick="togglePdfFrame(${idx})">Aperçu</button>
                </div>
              </div>
            </div>

            <div class="pdf-frame" id="pdfframe-${idx}" style="display:none;">
              <iframe src="${n.pdfLink || n.pdf_url || n.pdf}" width="100%" height="300" frameborder="0"></iframe>
            </div>
          ` : ''}

          <div class="actions">

            <button class="small-btn read-btn"
              onclick="markRead(${idx})">
              ✅ Marquer lu
            </button>

            <button class="small-btn delete-btn"
              onclick="removeNote(${idx})">
              🗑️ Supprimer
            </button>

          </div>

        </div>
      `;
    }).join('');
  }

  // --- Mobile admin panel logic ---
  function openMobileAdmin(){
    // require admin code to open
    try{
      if(sessionStorage.getItem('gsm_code') !== '1'){
        const code = prompt('Entrez le code admin');
        if(!code) return;
        const res = fetch('/api/auth/verify-code', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({code}) }).then(r=>{ if(!r.ok) throw new Error('invalid'); sessionStorage.setItem('gsm_code','1'); openMobileAdmin(); }).catch(()=>{ alert('Code invalide'); });
        return;
      }
    }catch(e){}
    const panel = document.getElementById('mobileAdminPanel');
    if(!panel) return;
    panel.classList.add('show');
    panel.style.display = 'block';
    panel.setAttribute('aria-hidden','false');
  }

  function closeMobileAdmin(){
    const panel = document.getElementById('mobileAdminPanel');
    if(!panel) return;
    panel.classList.remove('show');
    panel.setAttribute('aria-hidden','true');
    setTimeout(()=>{ panel.style.display = 'none'; },260);
  }

  function saveMobileAdmin(){
    const date = document.getElementById('mobileAdminDate').value || '';
    const note = document.getElementById('mobileAdminNote').value || '';
    const visible = !!document.getElementById('mobileAdminVisible') && document.getElementById('mobileAdminVisible').checked;
    try{ localStorage.setItem('admin_mobile_date', date); localStorage.setItem('admin_mobile_note', note); }catch(e){}
    // send to server to broadcast to all clients
    try{
      // use relative path so same-origin pages work without CORS issues
      fetch('/api/settings', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ selectedDate: date, note, visible }) }).catch(()=>{});
    }catch(e){}
    showToast('Note enregistrée');
    closeMobileAdmin();
  }

  function loadMobileAdmin(){
    const d = localStorage.getItem('admin_mobile_date') || '';
    const n = localStorage.getItem('admin_mobile_note') || '';
    const v = localStorage.getItem('admin_mobile_visible');
    const dateEl = document.getElementById('mobileAdminDate');
    const noteEl = document.getElementById('mobileAdminNote');
    const visibleEl = document.getElementById('mobileAdminVisible');
    if(dateEl) dateEl.value = d;
    if(noteEl) noteEl.value = n;
    try{ if(visibleEl) visibleEl.checked = (v === '1' || v === 'true'); }catch(e){}
  }

  // attach events for mobile admin controls
  (function(){
    const btn = document.getElementById('mobileAdminBtn');
    const closeBtn = document.getElementById('mobileAdminClose');
    const saveBtn = document.getElementById('mobileAdminSave');
    if(btn) btn.addEventListener('click', async function(){
      // require admin for opening
      if(sessionStorage.getItem('gsm_code') !== '1'){
        const code = prompt('Entrez le code admin');
        if(!code) return;
        try{
          const res = await fetch('/api/auth/verify-code', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({code}) });
          if(!res.ok){ alert('Code invalide'); return; }
          sessionStorage.setItem('gsm_code','1');
        }catch(e){ alert('Erreur de vérification'); return; }
      }
      openMobileAdmin();
    });
    if(closeBtn) closeBtn.addEventListener('click', closeMobileAdmin);
    if(saveBtn) saveBtn.addEventListener('click', saveMobileAdmin);
    // load stored values
    loadMobileAdmin();
    // make floating button draggable
    try{
      if(btn){
        const posRaw = localStorage.getItem('adminMobileBtnPos');
        if(posRaw){ const p = JSON.parse(posRaw); if(p.left!=null && p.top!=null){ btn.style.left = p.left + 'px'; btn.style.top = p.top + 'px'; btn.style.right = 'auto'; btn.style.bottom = 'auto'; } }
        let dragging=false, sx=0, sy=0, sl=0, st=0;
        function onDown(e){ e.preventDefault(); dragging=true; const p=(e.touches && e.touches[0])||e; sx=p.clientX; sy=p.clientY; const r=btn.getBoundingClientRect(); sl=r.left; st=r.top; document.addEventListener('mousemove', onMove); document.addEventListener('touchmove', onMove, {passive:false}); document.addEventListener('mouseup', onUp); document.addEventListener('touchend', onUp); }
        function onMove(e){ if(!dragging) return; e.preventDefault(); const p=(e.touches && e.touches[0])||e; const nx=sl + (p.clientX - sx); const ny=st + (p.clientY - sy); btn.style.left = Math.max(8, Math.min(window.innerWidth - btn.offsetWidth - 8, nx)) + 'px'; btn.style.top = Math.max(8, Math.min(window.innerHeight - btn.offsetHeight - 8, ny)) + 'px'; }
        function onUp(){ if(!dragging) return; dragging=false; document.removeEventListener('mousemove', onMove); document.removeEventListener('touchmove', onMove); document.removeEventListener('mouseup', onUp); document.removeEventListener('touchend', onUp); try{ localStorage.setItem('adminMobileBtnPos', JSON.stringify({ left: parseInt(btn.style.left||0,10), top: parseInt(btn.style.top||0,10) })); }catch(e){} }
        btn.addEventListener('mousedown', onDown); btn.addEventListener('touchstart', onDown, {passive:false});
      }
    }catch(e){}
  })();

  function add(note){

    const list = load();

    const exists = list.some(x =>
      x.bagage_numero &&
      x.bagage_numero === note.bagage_numero
    );

    if(exists) return;

    const newNote = {
      ...note,
      read:false,
      receivedAt:new Date().toISOString()
    };

    list.unshift(newNote);

    save(list.slice(0,300));

    render();

    playSound();

    showToast('Nouvelle réservation reçue');
  }

  function markRead(index){

    const list = load();

    if(!list[index]) return;

    list[index].read = true;

    save(list);

    render();
  }

  function removeNote(index){

    const list = load();

    list.splice(index,1);

    save(list);

    render();

    showToast('Notification supprimée');
  }

  function openPdf(index){
    const list = load();
    const item = list[index];
    const url = item && (item.pdf_url || item.pdf);
    if(!url){ showToast('Aucun PDF associé'); return; }
    window.open(url, '_blank');
  }

  function downloadPdf(index){
    const list = load();
    const item = list[index];
    const url = item && (item.pdf_url || item.pdf);
    if(!url){ showToast('Aucun PDF à télécharger'); return; }
    const a = document.createElement('a');
    a.href = url;
    a.download = item.pdf_name || url.split('/').pop();
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function togglePdfFrame(index){
    const el = document.getElementById('pdfframe-' + index);
    if(!el) return;
    el.style.display = (el.style.display === 'none' || el.style.display === '') ? 'block' : 'none';
  }

  function playSound(){

    try{
      const audio = new Audio(
        'https://actions.google.com/sounds/v1/alarms/notification_alert.ogg'
      );

      audio.volume = 0.4;

      audio.play();
    }catch(e){}
  }

  socket.on('connect', ()=>{

    document.getElementById('statusDot').classList.add('online');

    document.getElementById('statusText').textContent =
      'Connecté au serveur';

    document.getElementById('socketState').textContent = 'ON';

  });

  socket.on('disconnect', ()=>{

    document.getElementById('statusDot').classList.remove('online');

    document.getElementById('statusText').textContent =
      'Déconnecté';

    document.getElementById('socketState').textContent = 'OFF';

  });

  socket.on('booking_notification', data => {

    add(data);

  });

  socket.on('pending_notifications', list => {

    if(!Array.isArray(list)) return;

    const current = load();

    const merged = [...current];

    list.forEach(item => {

      const exists = merged.some(x =>
        x.bagage_numero === item.bagage_numero
      );

      if(!exists){
        merged.unshift(item);
      }

    });

    save(merged.slice(0,300));

    render();

  });

  socket.on('admin_registered', info => {

    if(info && info.ok){

      showToast('Admin authentifié');

    }else{

      alert('Code admin invalide');

    }

  });

  // When server generates a PDF, update matching notifications so admin can download it
  socket.on('pdf_generated', payload => {
    try {
      if (!payload || (!payload.filename && !payload.url)) return;
      const list = load();
      let updated = false;
      const url = payload.url && payload.url.startsWith('http') ? payload.url : (SERVER_ORIGIN + (payload.url || ''));
      list.forEach(item => {
        try {
          const fname = payload.filename || '';
          if (!fname) return;
          if ((item.bagage_numero && fname.includes(item.bagage_numero)) || (item.matricule && fname.includes(item.matricule))) {
            item.pdfLink = url;
            updated = true;
          }
        } catch (e) {}
      });
      if (updated) {
        save(list);
        render();
        showToast('PDF généré et attaché à la notification');
      }
    } catch (e) { console.warn('pdf_generated handler error', e); }
  });

  document.getElementById('btnAuth')
    .addEventListener('click', async ()=>{

      const code = prompt('Entrez le code admin');

      if(!code) return;

      try{

        const res = await fetch('/api/auth/verify-code',{
          method:'POST',
          headers:{
            'Content-Type':'application/json'
          },
          body:JSON.stringify({code})
        });

        if(!res.ok){

          alert('Code invalide');

          return;
        }

        sessionStorage.setItem('gsm_code','1');

        socket.emit('register_admin',code);

        showToast('Connexion admin réussie');

      }catch(err){

        console.error(err);

        alert('Erreur serveur');

      }

  });

  document.getElementById('markAll')
    .addEventListener('click',()=>{

      const list = load().map(n => ({
        ...n,
        read:true
      }));

      save(list);

      render();

      showToast('Toutes les notifications sont lues');

  });

  document.getElementById('clearAll')
    .addEventListener('click',()=>{

      if(!confirm('Supprimer toutes les notifications ?')) return;

      localStorage.removeItem(storageKey);

      render();

      showToast('Toutes les notifications supprimées');

  });

  render();
</script>

</body>
</html>
