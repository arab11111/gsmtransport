<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Gestionnaire Bagages GSM</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

:root{
  --primary:#1e40af;
  --primary-light:#3b82f6;
  --danger:#dc2626;
  --success:#16a34a;
  --bg:#f8fafc;
  --card:#ffffff;
  --text:#0f172a;
  --border:#e2e8f0;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;
  background:
  linear-gradient(rgba(255,255,255,.82),rgba(255,255,255,.82)),
  url('image/arriereplant.jpg') center/cover fixed;
  min-height:100vh;
  color:var(--text);
}

nav{
  background:linear-gradient(135deg,var(--primary),#1d4ed8);
  color:#fff;
  padding:15px 25px;
  position:sticky;
  top:0;
  z-index:999;
}

nav h1{
  font-family:'Poppins',sans-serif;
  font-size:22px;
}

.wrap{
  max-width:1400px;
  margin:auto;
  padding:20px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 340px;
  gap:20px;
}

.card{
  background:var(--card);
  border-radius:18px;
  padding:24px;
  border:1px solid var(--border);
  box-shadow:0 8px 20px rgba(0,0,0,.05);
}

.card-title{
  font-size:22px;
  font-weight:700;
  margin-bottom:20px;
  font-family:'Poppins',sans-serif;
}

form{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:16px;
}

.form-group{
  display:flex;
  flex-direction:column;
  gap:7px;
}

label{
  font-weight:600;
  font-size:14px;
}

input,
select{
  padding:13px;
  border-radius:12px;
  border:1px solid var(--border);
  font-size:14px;
}

input:focus,
select:focus{
  outline:none;
  border-color:var(--primary);
}

.btn{
  border:none;
  border-radius:12px;
  padding:12px 16px;
  cursor:pointer;
  font-weight:700;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn-primary{
  background:linear-gradient(135deg,var(--primary),var(--primary-light));
  color:#fff;
}

.btn-danger{
  background:var(--danger);
  color:#fff;
}

.btn-secondary{
  background:#f1f5f9;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:20px;
}

.table-wrap{
  overflow:auto;
  margin-top:20px;
  border-radius:14px;
  border:1px solid var(--border);
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:#eff6ff;
  padding:14px;
  text-align:left;
}

td{
  padding:14px;
  border-top:1px solid var(--border);
  font-size:14px;
}

tr:hover{
  background:#fafafa;
}

.badge{
  padding:5px 10px;
  border-radius:40px;
  font-size:12px;
  font-weight:700;
}

.badge-success{
  background:#dcfce7;
  color:#15803d;
}

.badge-danger{
  background:#fee2e2;
  color:#b91c1c;
}

.icon-btn{
  border:none;
  background:#f1f5f9;
  padding:8px;
  border-radius:10px;
  cursor:pointer;
}

.stat{
  padding:18px;
  border-radius:16px;
  margin-bottom:16px;
}

.stat h3{
  font-size:14px;
  margin-bottom:8px;
}

.stat strong{
  font-size:30px;
}

.green{
  background:#ecfdf5;
  border-left:5px solid var(--success);
}

.red{
  background:#fef2f2;
  border-left:5px solid var(--danger);
}

.blue{
  background:#eff6ff;
  border-left:5px solid var(--primary);
}

.notification{
  position:fixed;
  top:20px;
  right:20px;
  background:#111827;
  color:#fff;
  padding:14px 18px;
  border-radius:12px;
  display:none;
  z-index:9999;
}

.notification.show{
  display:block;
}

@media(max-width:1000px){

  .grid{
    grid-template-columns:1fr;
  }

}

@media(max-width:700px){

  form{
    grid-template-columns:1fr;
  }

}

/* Mobile: card-like table and tighter layout */
@media (max-width:600px) {

  .wrap { padding: 12px; }

  .grid { grid-template-columns: 1fr; gap: 12px; }

  .card { padding: 14px; border-radius:12px; }

  .card-title { font-size:18px; }

  form { grid-template-columns: 1fr; gap:10px; }

  .actions { flex-direction:column; align-items:stretch; }

  .actions .btn { width:100%; padding:12px; }

  .stat { padding:12px; }

  /* Make table responsive as stacked cards */
  .table-wrap { overflow:visible; }

  table thead { display:none; }

  table, tbody, tr, td { display:block; width:100%; }

  tbody tr { margin-bottom:12px; border-radius:10px; background:var(--card); box-shadow:0 6px 18px rgba(2,6,23,0.06); overflow:hidden; }

  td { padding:10px 12px; border-top:none; border-bottom:1px solid var(--border); color:var(--text); }

  td:before { content: attr(data-label); display:block; font-size:12px; color:#64748b; margin-bottom:6px; font-weight:700; }

  td:last-child { border-bottom:none; }

  .icon-btn { padding:10px; }

}

</style>
</head>

<body>

<nav>
  <h1>📦 GSM Transport Bagages</h1>
</nav>

<div class="notification" id="notification"></div>

<div class="wrap">

  <div class="grid">

    <!-- MAIN -->

    <div>

      <div class="card">

        <div class="card-title">
          Ajouter / Modifier
        </div>

        <form id="bagForm">

          <div class="form-group">

            <label>Matricule</label>

            <div style="display:flex;gap:8px">

              <input type="text" id="matricule" placeholder="GSM-2026-...">

              <button type="button" class="btn btn-secondary" id="searchMatriculeBtn">

                🔎 Chercher

              </button>

            </div>

            <div id="matriculeInfo" style="margin-top:8px;font-size:13px;color:#334155"></div>

          </div>

          <div class="form-group">
            <label>Numéro Bagage *</label>
            <input type="text" id="bag_number" required>
          </div>

          <div class="form-group">
            <label>Numéro France</label>
            <input type="text" id="num_fr">
          </div>

          <div class="form-group">
            <label>Numéro Algérie</label>
            <input type="text" id="num_dz">
          </div>

          <div class="form-group">
            <label>Région</label>

            <select id="region">
              <option value="">Sélectionner une région</option>
            </select>
          </div>

          <div class="form-group" id="horsWilayaBox" style="display:none">

            <label>Sous Région</label>

            <select id="subRegion">
              <option value="EAST">EAST</option>
              <option value="OUEST">OUEST</option>
            </select>

          </div>

          <div class="form-group">
            <label>Adresse</label>
            <input type="text" id="adresse">
          </div>

          <div class="form-group">
            <label>Type Bagage</label>
            <input type="text" id="type_bagage">
          </div>

          <div class="form-group">
            <label>Paiement</label>

            <select id="paid">
              <option value="">Choisir</option>
              <option value="Oui">Payé</option>
              <option value="Non">Non payé</option>
            </select>
          </div>

          <div class="form-group" id="amountBox" style="display:none">
            <label>Montant dû (€)</label>
            <input type="number" id="montant_due">
          </div>

          <div class="actions">

            <button class="btn btn-primary" type="submit">
              💾 Enregistrer
            </button>

            <button class="btn btn-secondary" type="reset">
              Réinitialiser
            </button>

          </div>

        </form>

      </div>

      <!-- TABLE -->

      <div class="card" style="margin-top:20px">

        <div class="card-title">
          Liste des Bagages
        </div>

        <div class="actions">

          <button class="btn btn-primary" id="downloadRegionPDF">
            📄 PDF Région
          </button>

          <button class="btn btn-primary" id="downloadAllRegionsPDF">
            📚 PDF Toutes Régions
          </button>

          <button class="btn btn-danger" id="downloadUnpaidPDF">
            🔴 PDF Non Payés
          </button>

          <button class="btn btn-secondary" id="downloadUnknownPDF">
            ❓ PDF Non Reconnu
          </button>

          <button class="btn btn-secondary" id="exportJSON">
            📤 Export JSON
          </button>

          <button class="btn btn-secondary" id="importJSON">
            📥 Import JSON
          </button>

          <input type="file" id="importJSONInput" accept="application/json" style="display:none">

          <button class="btn btn-danger" id="deleteAll">
            🗑️ Tout supprimer
          </button>

        </div>

        <div class="table-wrap">

          <table>

            <thead>

              <tr>
                <th>#</th>
                <th>Num Bag</th>
                <th>FR</th>
                <th>DZ</th>
                <th>Région</th>
                <th>Adresse</th>
                <th>Type</th>
                <th>Paiement</th>
                <th>Montant</th>
                <th>Actions</th>
              </tr>

            </thead>

            <tbody id="tbody"></tbody>

          </table>

        </div>

      </div>

    </div>

    <!-- STATS -->

    <div>

      <div class="card">

        <div class="card-title">
          📈 Statistiques
        </div>

        <div class="stat green">
          <h3>Payés</h3>
          <strong id="statPaid">0</strong>
        </div>

        <div class="stat red">
          <h3>Non Payés</h3>
          <strong id="statUnpaid">0</strong>
        </div>

        <div class="stat blue">
          <h3>Total dû</h3>
          <strong id="statTotal">0 €</strong>
        </div>

      </div>

    </div>

  </div>

</div>

<!-- PDF -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

<script>

(() => {

const STORAGE_KEY = 'gsm_bagages_v20';

const REGIONS = [
  "Tiziouzou",
  "Michelet",
  "Illoula",
  "Azazga",
  "Bejaia",
  "Alger",
  "Region non reconnu",
  "Hors Wilaya"
];

const region = document.getElementById('region');
const subRegion = document.getElementById('subRegion');
const horsWilayaBox = document.getElementById('horsWilayaBox');

const bagForm = document.getElementById('bagForm');

const paid = document.getElementById('paid');

const amountBox = document.getElementById('amountBox');

const tbody = document.getElementById('tbody');

let editingId = null;

let data = JSON.parse(
  localStorage.getItem(STORAGE_KEY) || '[]'
);

/* ========================
   NOTIFICATION
======================== */

function showNotification(text){

  const box = document.getElementById('notification');

  box.textContent = text;

  box.classList.add('show');

  setTimeout(() => {

    box.classList.remove('show');

  },3000);

}

/* ========================
   REGIONS
======================== */

REGIONS.forEach(r => {

  const option = document.createElement('option');

  option.value = r;

  option.textContent = r;

  region.appendChild(option);

});

region.addEventListener('change', () => {

  horsWilayaBox.style.display =
    region.value === 'Hors Wilaya'
    ? 'block'
    : 'none';

});

/* ========================
   PAYMENT
======================== */

paid.addEventListener('change', () => {

  amountBox.style.display =
    paid.value === 'Non'
    ? 'block'
    : 'none';

});

/* ========================
   SAVE
======================== */

function save(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

}

/* ========================
   MONEY
======================== */

function money(v){

  return new Intl.NumberFormat(
    'fr-FR',
    {
      style:'currency',
      currency:'EUR'
    }
  ).format(v || 0);

}

/* ========================
   FORM
======================== */

bagForm.addEventListener('submit', e => {

  e.preventDefault();

  const bag_number =
  document.getElementById('bag_number').value.trim();

  if(!bag_number){

    showNotification('Numéro obligatoire');
    return;

  }

  const paidValue =
  document.getElementById('paid').value;

  const montant =
  document.getElementById('montant_due').value;

  if(
    paidValue === 'Non'
    &&
    (!montant || montant <= 0)
  ){
    showNotification('Montant invalide');
    return;
  }

  let regionValue = region.value;

  if(regionValue === 'Hors Wilaya'){

    regionValue =
      'Hors Wilaya - ' + subRegion.value;

  }

  const item = {

    id: editingId || Date.now().toString(),

    bag_number,

    num_fr:
      document.getElementById('num_fr').value,

    num_dz:
      document.getElementById('num_dz').value,

    region: regionValue,

    adresse:
      document.getElementById('adresse').value,

    type_bagage:
      document.getElementById('type_bagage').value,

    paid: paidValue,

    montant_due:
      paidValue === 'Non'
      ? Number(montant)
      : ''

  };

  if(editingId){

    const index = data.findIndex(
      i => i.id === editingId
    );

    data[index] = item;

    showNotification('Bagage modifié');

  }else{

    data.push(item);

    showNotification('Bagage ajouté');

  }

  save();

  render();

  bagForm.reset();

  amountBox.style.display = 'none';

  horsWilayaBox.style.display = 'none';

  editingId = null;

});

/* ========================
   RENDER
======================== */

function render(){

  tbody.innerHTML = '';

  if(data.length === 0){

    tbody.innerHTML = `
      <tr>
        <td colspan="10" style="text-align:center">
          Aucun bagage
        </td>
      </tr>
    `;

    updateStats();

    return;

  }

  data.forEach((item,index) => {

    const tr = document.createElement('tr');

    tr.innerHTML = `

      <td>${index+1}</td>

      <td>${item.bag_number}</td>

      <td>${item.num_fr}</td>

      <td style="
        color:${item.paid === 'Non' ? '#dc2626' : '#111'};
        font-weight:700;
      ">
        ${item.num_dz}
      </td>

      <td>${item.region}</td>

      <td>${item.adresse}</td>

      <td>${item.type_bagage}</td>

      <td>

        ${
          item.paid === 'Oui'
          ?
          '<span class="badge badge-success">Payé</span>'
          :
          '<span class="badge badge-danger">Non payé</span>'
        }

      </td>

      <td style="
        color:${item.paid === 'Non' ? '#dc2626' : '#111'};
        font-weight:700;
      ">
        ${
          item.montant_due
          ? money(item.montant_due)
          : ''
        }
      </td>

      <td>

        <button
          class="icon-btn"
          onclick="editBag('${item.id}')"
        >
          ✏️
        </button>

        <button
          class="icon-btn"
          onclick="deleteBag('${item.id}')"
        >
          🗑️
        </button>

      </td>

    `;

    tbody.appendChild(tr);

  });

  updateStats();

  // apply data-label attributes to td for mobile card view
  try {
    const headers = Array.from(document.querySelectorAll('table thead th')).map(h => h.textContent.trim());
    Array.from(tbody.querySelectorAll('tr')).forEach(tr => {
      Array.from(tr.children).forEach((td, i) => {
        td.setAttribute('data-label', headers[i] || '');
      });
    });
  } catch (e) { /* ignore */ }

}

/* ========================
   STATS
======================== */

function updateStats(){

  const paidCount =
  data.filter(i => i.paid === 'Oui').length;

  const unpaidCount =
  data.filter(i => i.paid === 'Non').length;

  const total =
  data
  .filter(i => i.paid === 'Non')
  .reduce((a,b) =>
    a + Number(b.montant_due || 0)
  ,0);

  document.getElementById('statPaid')
  .textContent = paidCount;

  document.getElementById('statUnpaid')
  .textContent = unpaidCount;

  document.getElementById('statTotal')
  .textContent = money(total);

}

/* ========================
   EDIT
======================== */

window.editBag = function(id){

  const item = data.find(i => i.id === id);

  if(!item) return;

  editingId = id;

  document.getElementById('bag_number').value =
  item.bag_number;

  document.getElementById('num_fr').value =
  item.num_fr;

  document.getElementById('num_dz').value =
  item.num_dz;

  document.getElementById('adresse').value =
  item.adresse;

  document.getElementById('type_bagage').value =
  item.type_bagage;

  document.getElementById('paid').value =
  item.paid;

  document.getElementById('montant_due').value =
  item.montant_due;

  if(item.region.startsWith('Hors Wilaya')){

    region.value = 'Hors Wilaya';

    horsWilayaBox.style.display = 'block';

    if(item.region.includes('EAST')){

      subRegion.value = 'EAST';

    }else{

      subRegion.value = 'OUEST';

    }

  }else{

    region.value = item.region;

  }

  amountBox.style.display =
    item.paid === 'Non'
    ? 'block'
    : 'none';

  window.scrollTo({
    top:0,
    behavior:'smooth'
  });

}

/* ========================
   DELETE
======================== */

window.deleteBag = function(id){

  if(!confirm('Supprimer ce bagage ?'))
    return;

  data = data.filter(i => i.id !== id);

  save();

  render();

  showNotification('Bagage supprimé');

}

/* ========================
   DELETE ALL
======================== */

document
.getElementById('deleteAll')
.addEventListener('click', () => {

  if(!confirm('Supprimer tous les bagages ?'))
    return;

  data = [];

  save();

  render();

  showNotification('Tous supprimés');

});

/* ========================
   PDF
======================== */

function makePDF(title, rows, redMode=false){

  const { jsPDF } = window.jspdf;

  const doc = new jsPDF();

  doc.setFontSize(18);

  doc.text(title,14,20);

  const body = rows.map((item,index) => [

    index+1,

    item.bag_number,

    item.num_fr,

    item.num_dz,

    item.region,

    item.type_bagage,

    item.paid,

    item.montant_due
    ? item.montant_due + ' €'
    : ''

  ]);

  doc.autoTable({

    startY:30,

    head:[[
      '#',
      'Bagage',
      'FR',
      'DZ',
      'Region',
      'Type',
      'Paiement',
      'Montant'
    ]],

    body,

    styles:{
      fontSize:10
    },

    headStyles:{
      fillColor:
        redMode
        ? [220,38,38]
        : [30,64,175]
    },

    didParseCell:function(dataTable){

      if(dataTable.section === 'body'){

        const item =
        rows[dataTable.row.index];

        if(item.paid === 'Non'){

          dataTable.cell.styles.textColor =
          [220,38,38];

        }

      }

    }

  });

  doc.save(title + '.pdf');

}

/* ========================
   PDF REGION
======================== */

document
.getElementById('downloadRegionPDF')
.addEventListener('click', () => {

  let selected = region.value;

  if(!selected){

    showNotification('Choisir une région');
    return;

  }

  if(selected === 'Hors Wilaya'){

    selected =
    'Hors Wilaya - ' + subRegion.value;

  }

  const rows =
  data.filter(i => i.region === selected);

  if(rows.length === 0){

    showNotification('Aucune donnée');

    return;

  }

  makePDF(
    'Region_' + selected,
    rows
  );

});

/* ========================
   PDF TOUTES REGIONS
======================== */

document
.getElementById('downloadAllRegionsPDF')
.addEventListener('click', () => {

  const uniqueRegions =
  [...new Set(data.map(i => i.region))];

  uniqueRegions.forEach(regionName => {

    const rows =
    data.filter(i => i.region === regionName);

    if(rows.length){

      makePDF(
        'Region_' + regionName,
        rows
      );

    }

  });

});

/* ========================
   PDF NON PAYES
======================== */

document
.getElementById('downloadUnpaidPDF')
.addEventListener('click', () => {

  const rows =
  data.filter(i => i.paid === 'Non');

  if(rows.length === 0){

    showNotification('Aucun non payé');

    return;

  }

  makePDF(
    'Bagages_Non_Payes',
    rows,
    true
  );

});

/* ========================
   PDF NON RECONNU
======================== */

document
.getElementById('downloadUnknownPDF')
.addEventListener('click', () => {

  const rows =
  data.filter(
    i => i.region === 'Region non reconnu'
  );

  if(rows.length === 0){

    showNotification('Aucune région non reconnue');

    return;

  }

  makePDF(
    'Regions_Non_Reconnues',
    rows
  );

});

/* ========================
   EXPORT JSON
======================== */

document
.getElementById('exportJSON')
.addEventListener('click', () => {

  const blob = new Blob(
    [JSON.stringify(data,null,2)],
    {type:'application/json'}
  );

  const url =
  URL.createObjectURL(blob);

  const a =
  document.createElement('a');

  a.href = url;

  a.download = 'bagages.json';

  a.click();

  URL.revokeObjectURL(url);

});

/* ========================
   IMPORT JSON
======================== */

document
  .getElementById('importJSON')
  .addEventListener('click', () => {

    document.getElementById('importJSONInput').click();

  });

document
  .getElementById('importJSONInput')
  .addEventListener('change', (e) => {

    const file = e.target.files && e.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(evt){

      try{

        let parsed = JSON.parse(evt.target.result);

        if(!Array.isArray(parsed)){

          if(parsed.data && Array.isArray(parsed.data)) parsed = parsed.data;
          else if(parsed.bagages && Array.isArray(parsed.bagages)) parsed = parsed.bagages;
          else if(parsed.items && Array.isArray(parsed.items)) parsed = parsed.items;
          else throw new Error('Invalid format');

        }

        const replace = confirm('Remplacer les données existantes ? OK = Remplacer, Annuler = Ajouter');

        if(replace){

          data = parsed.map(item => {
            if(!item.id) item.id = Date.now().toString() + Math.random().toString(36).slice(2);
            return item;
          });

        }else{

          const map = new Map(data.map(i => [i.id, i]));

          parsed.forEach(item => {

            if(!item.id) item.id = Date.now().toString() + Math.random().toString(36).slice(2);

            // merge/replace by id
            map.set(item.id, item);

          });

          data = Array.from(map.values());

        }

        save();

        render();

        showNotification('Import JSON réussi');

      }catch(err){

        console.error(err);

        showNotification('Fichier JSON invalide');

      }finally{

        e.target.value = '';

      }

    };

    reader.readAsText(file);

  });

/* ========================
   INIT
======================== */

render();

})();

/* ========================
   MATRICULE SEARCH
======================== */

// search by matricule and prefill fields
document
  .getElementById('searchMatriculeBtn')
  .addEventListener('click', async () => {

    const q = document.getElementById('matricule').value.trim();

    if(!q){

      showNotification('Entrer un matricule');

      return;

    }

    try{

      const res = await fetch('/api/users?matricule=' + encodeURIComponent(q));

      if(!res.ok) throw new Error('Erreur serveur');

      const users = await res.json();

      if(!Array.isArray(users) || users.length === 0){

        showNotification('Aucun utilisateur trouvé');

        document.getElementById('matriculeInfo').textContent = '';

        return;

      }

      const u = users[0];

      document.getElementById('matriculeInfo').textContent =
        (u.nom || '') + ' ' + (u.prenom || '') + (u.whatsapp ? ' • ' + u.whatsapp : '');

      // Prefill phone fields when possible
      if(u.pays_residence && /fr/i.test(u.pays_residence)){
        if(u.whatsapp) document.getElementById('num_fr').value = u.whatsapp;
      }else{
        if(u.whatsapp) document.getElementById('num_dz').value = u.whatsapp;
      }

      // Prefill address
      if(u.adresse_france) document.getElementById('adresse').value = u.adresse_france;
      else if(u.adresse_algerie) document.getElementById('adresse').value = u.adresse_algerie;

      showNotification('Utilisateur chargé');

    }catch(err){

      console.error(err);

      showNotification('Erreur lors de la recherche');

    }

  });

// allow Enter to trigger search
document.getElementById('matricule')
  .addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){
      e.preventDefault();
      document.getElementById('searchMatriculeBtn').click();
    }
  });

</script>
