<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GSM Express - Réservation Bagage</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:#0f172a;color:white;min-height:100vh;display:flex;flex-direction:column}
  header{width:100%;background:#111827;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:1000}
  .logo{font-size:20px;color:#38bdf8;font-weight:800}
  .menu-btn{background:#2563eb;color:#fff;border:none;padding:8px 12px;border-radius:8px;cursor:pointer}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:28px 16px}
  .container{width:100%;max-width:780px;background:#0b1220;padding:22px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,0.45)}
  .container h1{color:#38bdf8;margin-bottom:12px;text-align:center}
  label{display:block;margin-top:12px;margin-bottom:6px;color:#cbd5e1;font-weight:700}
  input,select,textarea{width:100%;padding:12px;border-radius:10px;border:none;background:#1f2937;color:#fff}
  textarea{min-height:90px}
  input:focus,select:focus,textarea:focus{outline:none;box-shadow:0 0 0 3px rgba(56,189,248,0.08)}
  .submit-btn{width:100%;margin-top:14px;background:linear-gradient(90deg,#2563eb,#38bdf8);border:none;padding:14px;color:white;border-radius:12px;font-weight:800;cursor:pointer}
  .row{display:flex;gap:10px}
  .matricule-line{margin-top:10px;display:flex;gap:8px;align-items:center}
  .small-btn{padding:8px 10px;border-radius:10px;border:none;cursor:pointer;font-weight:700}
  #qrZone{margin-top:14px;text-align:center}
  footer{width:100%;background:#111827;padding:14px;text-align:center;color:#94a3b8;margin-top:18px}
  @media(max-width:700px){.row{flex-direction:column}}
  </style>
</head>
<body>
  <header>
    <div class="logo">GSM Express</div>
    <button class="menu-btn" onclick="openMenu()">☰ Menu</button>
  </header>

  <nav id="sidebar" style="position:fixed;left:-300px;top:0;height:100vh;width:260px;background:#071028;padding:20px;transition:transform .25s ease;z-index:2000;box-shadow:8px 0 30px rgba(0,0,0,0.6);">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
      <img src="image/polo1.png" alt="logo" style="width:56px;height:56px;object-fit:cover;border-radius:8px;opacity:0.08">
      <div style="font-weight:800;color:#93c5fd">GSM Express</div>
    </div>
    <a href="index.html" style="display:block;color:#cfe9ff;margin:8px 0;text-decoration:none;font-weight:700">Accueil</a>
    <a href="#reservation" style="display:block;color:#cfe9ff;margin:8px 0;text-decoration:none;font-weight:700">Réservation</a>
    <a href="contact.html" style="display:block;color:#cfe9ff;margin:8px 0;text-decoration:none;font-weight:700">Contact</a>
    <a href="privacy.html" style="display:block;color:#cfe9ff;margin:8px 0;text-decoration:none;font-weight:700">Privacy</a>
    <a href="terms.html" style="display:block;color:#cfe9ff;margin:8px 0;text-decoration:none;font-weight:700">Termes</a>
    <a href="#faq" style="display:block;color:#cfe9ff;margin:8px 0;text-decoration:none;font-weight:700">FAQ</a>
    <button id="btnLogout" style="margin-top:14px;background:#dc2626;color:#fff;border:none;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:800">Déconnecter</button>
  </nav>

  <div id="sidebar-backdrop" style="position:fixed;left:0;top:0;width:100%;height:100vh;background:rgba(0,0,0,0.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:1999"></div>

  <main>
    <div class="container">
      <h1>Réservation Bagage</h1>
      <div id="adminInfo" style="margin:8px 0;padding:10px;border-radius:8px;background:#071b2a;color:#cde7ff;font-size:0.95em;display:none">
        <div id="adminNote" style="margin-bottom:6px"></div>
        <div id="departureDate" style="font-weight:700"></div>
      </div>

      <div id="matriculeLine" class="matricule-line" style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <strong>Matricule client:</strong>
          <span id="matriculeDisplay" style="margin-left:8px;color:#cbd5e1;font-weight:700">—</span>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <input id="matriculeInput" placeholder="Saisir matricule" style="width:220px;background:#0f172a;border:1px solid #23303b;padding:8px;border-radius:8px;color:#fff" />
          <button id="saveMatBtn" class="small-btn" style="background:#16a34a;color:#fff">Sauvegarder</button>
        </div>
      </div>

      <form id="reservationForm">
        <label>Pays de destination</label>
        <select id="pays_dest" required>
          <option value="">Choisir</option>
          <option value="Algérie">Algérie</option>
          <option value="France">France</option>
        </select>
        <div id="destinationZone"></div>

        <label>Nom expéditeur</label>
        <input id="exp_nom" type="text" required />

        <label>Prénom expéditeur</label>
        <input id="exp_prenom" type="text" required />

        <label>Téléphone expéditeur</label>
        <input id="exp_tel" type="tel" required />

        <label>Nom destinataire</label>
        <input id="dest_nom" type="text" required />

        <label>Prénom destinataire</label>
        <input id="dest_prenom" type="text" required />

        <label>Téléphone destinataire</label>
        <input id="dest_tel" type="tel" required />

        <label>Nombre de bagages</label>
        <input id="nb_bagages" type="number" min="1" required />

        <label>Poids total (kg)</label>
        <input id="poids" type="number" step="0.1" required />
        <div id="priceInfo" style="margin-top:8px;color:#9be7c6;font-weight:700;display:none"></div>

        <label>Note</label>
        <textarea id="notes" placeholder="Note éventuelle"></textarea>

        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
          <button id="btnQr" type="button" class="small-btn" style="background:linear-gradient(90deg,#7c3aed,#6d28d9);color:#fff">QR Code</button>
          <button id="btnDownloadPdf" type="button" class="small-btn" style="background:linear-gradient(90deg,#06b6d4,#0891b2);color:#fff">Télécharger PDF</button>
          <button id="btnClear" type="button" class="small-btn" style="background:#374151;color:#fff">Nettoyer</button>
        </div>

        <button class="submit-btn" type="submit">Réserver</button>
      </form>

      <div id="qrZone"></div>
      <div id="pdfStatus" style="display:none;margin-top:12px;background:linear-gradient(90deg,#062a4a,#063246);padding:12px;border-radius:10px;color:#d1fae5;font-weight:700"></div>
      <div id="confirmationBanner" style="display:none;margin-top:12px;background:linear-gradient(90deg,#062a4a,#083047);padding:16px;border-radius:12px;color:#fff;font-weight:800;text-align:center">
        <div style="font-size:18px;opacity:0.85">Confirmation — Montant à payer</div>
        <div id="confirmPrice" style="font-size:32px;margin-top:6px;color:#a7f3d0"></div>
      </div>
    </div>
  </main>

  <footer>© 2026 GSM Express — MJ Tiddas Studio — Tous droits réservés</footer>

  <!-- libs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>

  <script>
  // Server origin (supports local dev on :3002)
  const SERVER_ORIGIN = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
    ? (window.location.protocol + '//' + window.location.hostname + ':3002')
    : window.location.origin;

  const socket = io(SERVER_ORIGIN);

  // Initialize matricule from localStorage
  function loadMatricule() {
    try { return localStorage.getItem('gsm_matricule') || ''; } catch (e) { return ''; }
  }
  function saveMatricule(v) { try { localStorage.setItem('gsm_matricule', v || ''); } catch (e) {} }

  const matriculeDisplay = document.getElementById('matriculeDisplay');
  const matriculeInput = document.getElementById('matriculeInput');
  const saveMatBtn = document.getElementById('saveMatBtn');
  function updateMatriculeUI() {
    const m = loadMatricule();
    matriculeDisplay.textContent = m || '—';
    matriculeInput.value = m || '';
  }
  saveMatBtn.addEventListener('click', () => { const v = (matriculeInput.value||'').trim(); saveMatricule(v); updateMatriculeUI(); alert('Matricule sauvegardée'); });
  updateMatriculeUI();

  // Destination dynamic fields
  const wilayas = ["Adrar","Chlef","Laghouat","Oum El Bouaghi","Batna","Béjaïa","Biskra","Béchar","Blida","Bouira","Tamanrasset","Tébessa","Tlemcen","Tiaret","Tizi Ouzou","Alger","Djelfa","Jijel","Sétif","Saïda","Skikda","Sidi Bel Abbès","Annaba","Guelma","Constantine","Médéa","Mostaganem","M'Sila","Mascara","Ouargla","Oran","El Bayadh","Illizi","Bordj Bou Arréridj","Boumerdès","El Tarf","Tindouf","Tissemsilt","El Oued","Khenchela","Souk Ahras","Tipaza","Mila","Aïn Defla","Naâma","Aïn Témouchent","Ghardaïa","Relizane"];
  const regionsTizi = ["Azazga","Mekla","Michelet","Iferhounene","Illoula","Bouzeggane","Freha","Yakouren","Azefoun","Tigzirt","Tizi Ville","Draa Ben Khedda","Bni Douala","Ouad Aissi","Ouadhiya","Ouacif"];

  document.getElementById('pays_dest').addEventListener('change', function(){
    const pays = this.value; const zone = document.getElementById('destinationZone');
    if(pays === 'Algérie'){
      let options = '<option value="">Choisir une wilaya</option>';
      wilayas.forEach(w => options += `<option value="${w}">${w}</option>`);
      zone.innerHTML = `<label>Wilaya</label><select id="wilaya_select" required>${options}</select><div id="extraZone"></div>`;
      document.getElementById('wilaya_select').addEventListener('change', function(){
        const wilaya = this.value; const extra = document.getElementById('extraZone');
        if(wilaya === 'Tizi Ouzou'){
          let reg = '<option value="">Choisir région</option>';
          regionsTizi.forEach(r => reg += `<option value="${r}">${r}</option>`);
          extra.innerHTML = `<label>Région</label><select id="region_tizi" required>${reg}</select>`;
        } else if(wilaya !== ''){
          extra.innerHTML = `<label>Adresse exacte</label><textarea id="adresse_exacte" placeholder="Commune, rue..." required></textarea>`;
        } else { extra.innerHTML = ''; }
      });
    } else if(pays === 'France'){
      zone.innerHTML = `<label>Ville</label><select id="ville_fr" required><option value="">Choisir</option><option value="Paris">Paris</option><option value="Lyon">Lyon</option><option value="Marseille">Marseille</option></select><label>Adresse exacte</label><textarea id="adresse_fr" placeholder="Numéro, rue..." required></textarea>`;
    } else { zone.innerHTML = ''; }
  });

  // QR code
  const qrZone = document.getElementById('qrZone');
  document.getElementById('btnQr').addEventListener('click', function(){
    const data = collectFormData();
    qrZone.innerHTML = '';
    try { new QRCode(qrZone, { text: JSON.stringify(data), width: 160, height: 160, colorDark: '#1e40af', colorLight: '#fff' }); } catch(e){ qrZone.textContent = 'QR failed'; }
  });

  // Clear
  // prevent double submits: disable submit until user clicks Nettoyer
  let formSubmitted = false;
  const submitBtn = document.querySelector('.submit-btn');
  const originalSubmitText = submitBtn ? submitBtn.textContent : 'Réserver';

  document.getElementById('btnClear').addEventListener('click', function(){
    document.getElementById('reservationForm').reset();
    updateMatriculeUI();
    qrZone.innerHTML='';
    formSubmitted = false;
    try { if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = originalSubmitText; } } catch(e){}
    try { const b = document.getElementById('confirmationBanner'); if (b) { b.style.display = 'none'; } const cp = document.getElementById('confirmPrice'); if(cp) cp.textContent = ''; if (pdfStatusElem) pdfStatusElem.style.display='none'; if (priceInfo) priceInfo.style.display='none'; } catch(e){}
  });

  // collect data and include matricule
  function collectFormData(){
    const pays = document.getElementById('pays_dest').value || '';
    const wilaya = document.getElementById('wilaya_select') ? document.getElementById('wilaya_select').value : '';
    const region = document.getElementById('region_tizi') ? document.getElementById('region_tizi').value : (document.getElementById('adresse_exacte') ? document.getElementById('adresse_exacte').value : '');
    const ville = document.getElementById('ville_fr') ? document.getElementById('ville_fr').value : '';
    const adresse_fr = document.getElementById('adresse_fr') ? document.getElementById('adresse_fr').value : '';
    return {
      bagage_numero: `BAG-${Date.now()}`,
      matricule: loadMatricule(),
      exp_nom: document.getElementById('exp_nom').value,
      exp_prenom: document.getElementById('exp_prenom').value,
      exp_tel: document.getElementById('exp_tel').value,
      dest_nom: document.getElementById('dest_nom').value,
      dest_prenom: document.getElementById('dest_prenom').value,
      dest_tel: document.getElementById('dest_tel').value,
      pays_dest: pays,
      destination: pays === 'Algérie' ? wilaya : (pays === 'France' ? ville : ''),
      region: pays === 'Algérie' ? region : adresse_fr,
      nb_bagages: document.getElementById('nb_bagages').value,
      poids: document.getElementById('poids').value,
      prix: computePriceValue(),
      notes: document.getElementById('notes').value
    };
  }

  // Price calculation rules
  function rateForWeight(w){
    const weight = parseFloat(w) || 0;
    if (weight <= 0) return 0;
    if (weight < 10) return 4.0;
    if (weight >= 10 && weight <= 20) return 3.5;
    return 3.0;
  }
  function computePriceValue(){
    const w = parseFloat(document.getElementById('poids').value || 0);
    if (!w || w <= 0) return 0;
    const rate = rateForWeight(w);
    const total = Math.round((w * rate) * 100) / 100;
    return total;
  }
  // update price display
  const priceInfo = document.getElementById('priceInfo');
  function updatePriceDisplay(){
    try {
      const w = parseFloat(document.getElementById('poids').value || 0);
      if (!w || w <= 0) { priceInfo.style.display='none'; priceInfo.textContent=''; return; }
      const rate = rateForWeight(w);
      const total = computePriceValue();
      priceInfo.style.display='block';
      priceInfo.textContent = `Tarif: ${rate} €/kg — Total estimé: ${total} €`;
    } catch(e){ }
  }
  document.getElementById('poids').addEventListener('input', updatePriceDisplay);
  // initialize price if valeur present
  updatePriceDisplay();

  // fetch admin settings (note and selectedDate)
  async function loadAdminSettings(){
    try {
      const res = await fetch(SERVER_ORIGIN + '/api/settings');
      if (!res.ok) return;
      const s = await res.json().catch(()=>null);
      if (!s) return;
      const noteEl = document.getElementById('adminNote');
      const dateEl = document.getElementById('departureDate');
      if ((s.note && s.note.toString().trim()) || s.selectedDate) {
        document.getElementById('adminInfo').style.display = 'block';
      }
      if (s.note) noteEl.textContent = 'Note admin: ' + s.note;
      if (s.selectedDate) dateEl.textContent = 'Date de départ: ' + s.selectedDate;
    } catch(e) { /* ignore */ }
  }
  loadAdminSettings();
  // update live via socket
  try { socket.on && socket.on('settings_updated', (s)=>{ if(s){ try{ if(s.note) document.getElementById('adminNote').textContent = 'Note admin: ' + s.note; if(s.selectedDate) document.getElementById('departureDate').textContent = 'Date de départ: ' + s.selectedDate; document.getElementById('adminInfo').style.display='block'; }catch(e){} } }); } catch(e){}

  // submit handler: POST /api/bookings and handle PDF link
  document.getElementById('reservationForm').addEventListener('submit', async function(e){
    e.preventDefault();
    if (formSubmitted) { alert('Réservation en cours — utilisez Nettoyer pour en créer une nouvelle.'); return; }
    formSubmitted = true;
    try { if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Envoi...'; } } catch(e){}
    const data = collectFormData();
    try {
      const res = await fetch(SERVER_ORIGIN + '/api/bookings', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) });
      if (!res.ok) { alert('Erreur serveur: ' + (res.status || '')); return; }
      const json = await res.json().catch(()=>({}));
      alert('Réservation envoyée');
      // remember last submitted bagage id so we can match pdf_generated events
      try { window.lastBagageId = data.bagage_numero; } catch (e) { window.lastBagageId = null; }
      // show confirmation banner with price
      try {
        const total = (data && data.prix) ? data.prix : computePriceValue();
        const cp = document.getElementById('confirmPrice');
        const b = document.getElementById('confirmationBanner');
        if (cp) cp.textContent = (typeof total === 'number' ? (Math.round(total*100)/100) : total) + ' €';
        if (b) b.style.display = 'block';
      } catch(e){}
      // show waiting indicator
      try { showPdfWaiting(); } catch (e){}
      // If server returned immediate PDF link, open it and show ready
      if (json && json.pdf) {
        const url = json.pdf.startsWith('http') ? json.pdf : (SERVER_ORIGIN + json.pdf);
        try { showPdfReady(url, json.pdf); window.open(url, '_blank'); } catch(e){}
      }
      // keep the form disabled until user clears (Nettoyer) to avoid duplicate notifications
    } catch (err) { console.warn('submit error', err); alert('Erreur envoi réservation'); }
  });

  // Download PDF button: will try to request server to regenerate PDF for last submitted bagage or ask user
  document.getElementById('btnDownloadPdf').addEventListener('click', function(){
    let bagId = window.lastBagageId || prompt('Entrez le numéro de bagage (ex: BAG-...):');
    if (!bagId) return;
    const url = SERVER_ORIGIN + '/generate-pdf/' + encodeURIComponent(bagId);
    window.open(url, '_blank');
  });

  // helper: show waiting and ready states
  const pdfStatusElem = document.getElementById('pdfStatus');
  function showPdfWaiting(){ if(pdfStatusElem){ pdfStatusElem.style.display='block'; pdfStatusElem.textContent = 'PDF en attente...'; } }
  function showPdfReady(url, filename){ if(!pdfStatusElem) return; const link = `<a href="${url}" target="_blank" style="color:#a7f3d0;font-weight:800;text-decoration:underline;margin-right:10px">Ouvrir PDF</a>`; pdfStatusElem.innerHTML = `PDF prêt : ${link} <button id=\"pdfDownloadBtn\" style=\"background:#10b981;color:#042e1f;border:none;padding:6px 10px;border-radius:8px;cursor:pointer;font-weight:700\">Télécharger</button>`; pdfStatusElem.style.display='block'; const btn = document.getElementById('pdfDownloadBtn'); if(btn){ btn.onclick = ()=>{ window.open(url, '_blank'); }} }

  // Listen for pdf_generated events and show indicator when the generated PDF matches last submission or matricule
  socket.on('pdf_generated', (payload) => {
    try {
      if (!payload || !payload.filename || !payload.url) return;
      const fullUrl = payload.url.startsWith('http') ? payload.url : (SERVER_ORIGIN + payload.url);
      const filename = payload.filename || '';
      const watchMat = loadMatricule();
      const lastBag = window.lastBagageId || '';
      if ((lastBag && filename.includes(lastBag)) || (watchMat && filename.includes(watchMat))) {
        try { showPdfReady(fullUrl, filename); } catch(e){}
      }
    } catch (e) { console.warn('pdf_generated handler', e); }
  });

  // keep UI matricule in sync
  socket.on('connect', () => { updateMatriculeUI(); });

  </script>
  <script>
  // Sidebar controls
  function openMenu(){ document.getElementById('sidebar').style.transform = 'translateX(300px)'; document.getElementById('sidebar-backdrop').style.opacity='1'; document.getElementById('sidebar-backdrop').style.pointerEvents='auto'; }
  function closeMenu(){ document.getElementById('sidebar').style.transform = ''; document.getElementById('sidebar-backdrop').style.opacity='0'; document.getElementById('sidebar-backdrop').style.pointerEvents='none'; }
  document.getElementById('sidebar-backdrop').addEventListener('click', closeMenu);
  document.getElementById('btnLogout').addEventListener('click', function(){ try{ localStorage.removeItem('gsm_matricule'); sessionStorage.removeItem('gsm_code'); alert('Déconnecté'); window.location.href='/index.html'; }catch(e){} });

  // add subtle background image to container
  (function(){ try{ const c = document.querySelector('.container'); if(c){ c.style.backgroundImage = `radial-gradient(1200px 600px at 10% 10%, rgba(14,165,233,0.03), transparent), linear-gradient(120deg, rgba(30,64,175,0.06) 0%, rgba(14,165,233,0.02) 100%), url('image/polo1.png')`; c.style.backgroundSize = 'cover'; c.style.backgroundRepeat = 'no-repeat'; c.style.backgroundBlendMode = 'overlay'; c.style.backgroundPosition='left top'; } }catch(e){} })();

  // enhance France fields: ensure address label visible and required
  document.addEventListener('change', function(e){ try{ if(e.target && e.target.id === 'ville_fr'){ const extra = document.getElementById('destinationZone'); const addr = document.getElementById('adresse_fr'); if(addr) addr.required = true; } }catch(ex){} });
 
    showNotification(
    "Réservation envoyée avec succès ✅"
  );
  </script>
</body>
</html>
